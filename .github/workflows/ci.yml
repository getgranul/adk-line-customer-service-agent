name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      # tests/agent calls Gemini and needs credentials, so CI runs unit tests only.
      - name: Unit tests
        run: uv run pytest tests/unit
