[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-customer-service-agent"
version = "0.1.0"
description = "A LINE customer service agent with explicit human handoff."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "google-adk[gcp]>=2.14.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
# 預設只跑不需要網路的單元測試。Agent 情境測試會呼叫 Gemini，要明確指定 tests/agent 才跑。
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# 腳本要先載入 .env 再 import google 套件，所以 import 不在檔案最上方。
"scripts/*.py" = ["E402"]
